# Orchestrator runtime configuration.
# Tool and MCP server configs are no longer stored here — they live in the
# tenant_integrations table and are resolved per-request via ToolProvider and McpProvider.
#
# Use ORCHESTRATOR_ env vars to override values (dunder for nesting).
# Examples:
#   ORCHESTRATOR_LOG_LEVEL=DEBUG
#   ORCHESTRATOR_DATABASE__URL=postgresql+asyncpg://user:pass@host/db

cors:
  allow_origins:
    - "*"
    - "http://localhost"
    - "http://localhost:3000"
    - "http://localhost:5173"
    - "http://localhost:8080"
  allow_methods:
    - "*"
  allow_headers:
    - "*"
  allow_credentials: true
  max_age: 600

# PostgreSQL connection for tenants, integrations, skill execution reports, etc.
# Override at runtime with ORCHESTRATOR_DATABASE__URL.
database:
  url: postgresql+asyncpg://orchestrator:orchestrator@localhost:5432/orchestrator
  pool_size: 5
  max_overflow: 10
  pool_timeout: 30
  pool_recycle: 1800
  echo: false

# Local-friendly defaults: no API-key gate, no plan-quota enforcement on matched routes.
# For staging/production, set disabled: false, quota_disabled: false, and configure pepper + keys.
auth:
  disabled: true
  quota_disabled: true
  # Exact path + methods that skip API keys (see PublicRouteRule in settings).
  public_routes:
    - methods: [GET]
      path: /health
    - methods: [GET]
      path: /docs
    - methods: [GET]
      path: /redoc
    - methods: [GET]
      path: /openapi.json
    - methods: [POST]
      path: /tenants
  # Path regex + methods → plan_quotas.operation. First match wins.
  quota_routes:
    - path_pattern: "^/tasks/run$"
      methods: [POST]
      operation: task_run
      tenant_in_body: true
    - path_pattern: "^/tenants/[^/]+/skills$"
      methods: [POST]
      operation: skill_max
